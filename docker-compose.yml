services:
  postgres:
    image: postgres:17-alpine
    container_name: microsaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MicroSaaS_Postgres_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-MicroSaaS_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-MicroSaaS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microsaas-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microsaas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-MicroSaaS_DB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-MicroSaaS_Postgres_2026!}"
      JwtSettings__Secret: "${JWT_SECRET:-EstaEsUnaClaveSuperSecretaYDeLargoSuficienteParaMicroSaaS2026!}"
      JwtSettings__Issuer: "${JWT_ISSUER:-MicroSaaS_Auth}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-MicroSaaS_Tenants}"
      JwtSettings__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-1440}"
    ports:
      - "8080:8080"
    networks:
      - microsaas-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: microsaas-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "4200:80"
    networks:
      - microsaas-net

volumes:
  postgres_data:

networks:
  microsaas-net:
    driver: bridge

