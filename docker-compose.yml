services:
  postgres:
    image: postgres:17-alpine
    container_name: microsaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: MicroSaaS_DB
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      # Nuevo nombre de volumen para forzar una base de datos limpia
      - postgres_data_fresh:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MicroSaaS_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microsaas-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microsaas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=MicroSaaS_DB;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=60;"
      JwtSettings__Secret: ${JWT_SECRET}
      MasterKey_SII_Vault: ${SII_MASTER_KEY}
    ports:
      - "8080:8080"
    networks:
      - microsaas-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: microsaas-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "4200:80"
    networks:
      - microsaas-net

volumes:
  # Declaración del nuevo volumen
  postgres_data_fresh:

networks:
  microsaas-net:
    driver: bridge