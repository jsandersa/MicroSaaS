server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS interno de Docker para evitar caché de IP antigua al recrear microsaas-api
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compresión Gzip para optimizar transferencia de assets en OCI
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Proxy inverso hacia la API .NET 10 dentro de la red interna de Docker
    location /api/ {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso con soporte WebSockets para SignalR (/hubs/)
    location /hubs/ {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Soporte para enrutamiento SPA de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}

